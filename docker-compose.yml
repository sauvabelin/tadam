services:
  web:
    build: ./dist
    container_name: tadam-web
    ports:
      - "8080:80"
    volumes:
      - ./dist/uploads:/var/www/html/uploads
    environment:
      - MYSQL_DATABASE_URL=${MYSQL_DATABASE_URL:-}
      - MYSQL_HOST=db
      - MYSQL_DATABASE=${MYSQL_DATABASE:-tadam}
      - MYSQL_USER=${MYSQL_USER:-tadam}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-tadampassword}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-acriter1912}
      - SESSION_EXPIRY=${SESSION_EXPIRY:-86400}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
    depends_on:
      - db
    networks:
      - tadam-network

  db:
    image: mariadb:11
    container_name: tadam-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tadam}
      MYSQL_USER: ${MYSQL_USER:-tadam}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tadampassword}
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - tadam-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: tadam-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - tadam-network

networks:
  tadam-network:
    driver: bridge

volumes:
  mariadb-data:
