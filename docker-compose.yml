services:
  web:
    image: php:8.3-apache
    container_name: tadam-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    depends_on:
      - db
    networks:
      - tadam-network
    command: >
      bash -c "a2enmod rewrite &&
               echo '<Directory /var/www/html>
                 AllowOverride All
                 Require all granted
               </Directory>' > /etc/apache2/conf-available/custom.conf &&
               a2enconf custom &&
               apache2-foreground"

  db:
    image: mariadb:11
    container_name: tadam-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tadam}
      MYSQL_USER: ${MYSQL_USER:-tadam}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tadampassword}
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - tadam-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: tadam-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - tadam-network

networks:
  tadam-network:
    driver: bridge

volumes:
  mariadb-data:
